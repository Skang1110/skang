<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Karikatur AI - Kang Lukman</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }
            body {
                background: #111;
                color: #fff;
                text-align: center;
                padding: 20px;
            }
            h1 {
                color: #ffcc00;
                margin-bottom: 5px;
            }
            p {
                color: #aaa;
                margin-bottom: 20px;
            }
            .box {
                background: #222;
                padding: 20px;
                border-radius: 15px;
                max-width: 500px;
                margin: 0 auto;
            }
            input {
                display: none;
            }
            label {
                display: block;
                background: #ffcc00;
                color: #000;
                padding: 12px;
                border-radius: 10px;
                font-weight: bold;
                cursor: pointer;
            }
            img {
                width: 100%;
                margin-top: 15px;
                border-radius: 12px;
                display: none;
            }
            select,
            button {
                width: 100%;
                padding: 12px;
                margin-top: 12px;
                border-radius: 10px;
                border: none;
                font-size: 15px;
            }
            select {
                background: #333;
                color: #fff;
            }
            button {
                background: #ff3b3b;
                color: #fff;
                font-weight: bold;
                cursor: pointer;
            }
            button:hover {
                background: #e02e2e;
            }
            .hasil {
                margin-top: 15px;
                font-size: 14px;
                color: #0f0;
            }
            .gallery {
                display: flex;
                gap: 10px;
                justify-content: center;
                flex-wrap: wrap;
                margin-top: 25px;
            }
            .gallery img {
                display: block;
                width: 150px;
                height: 150px;
                object-fit: cover;
            }
        </style>
    </head>
    <body>
        <h1>🔥 KARIKATUR AI 🔥</h1>
        <p>Upload foto lu, pilih gaya, langsung jadi!</p>

        <div class="box">
            <label for="upload">📸 PILIH FOTO LU</label>
            <input type="file" id="upload" accept="image/*" />
            <img id="preview" />

            <select id="gaya">
                <option>Karikatur Halus</option>
                <option>Realistis AI - Jalan Senja Gunung</option>
                <option>Realistis AI - Pantai Santai</option>
                <option>Realistis AI - Sawah Pagi</option>
                <option>Karikatur Ekstrim Kepala Gede</option>
            </select>

            <button onclick="proses()">BUAT KARIKATUR 🚀</button>
            <div class="hasil" id="hasil"></div>
        </div>

        <h2 style="margin-top: 30px">Galeri Gue</h2>
        <div class="gallery">
            <img src="https://via.placeholder.com/150" />
            <img src="https://via.placeholder.com/150" />
            <img src="https://via.placeholder.com/150" />
        </div>

        <script>
            const upload = document.getElementById("upload");
            const preview = document.getElementById("preview");
            const hasil = document.getElementById("hasil");

            upload.addEventListener("change", function () {
                const file = this.files[0];
                if (file) {
                    preview.src = URL.createObjectURL(file);
                    preview.style.display = "block";
                    hasil.innerHTML = "";
                }
            });

            function proses() {
                if (!preview.src || preview.style.display === "none") {
                    alert("Pilih foto dulu bre!");
                    return;
                }
                const gaya = document.getElementById("gaya").value;
                hasil.innerHTML =
                    "⏳ Lagi diproses gaya: <b>" +
                    gaya +
                    "</b>... tunggu bentar bre!";
                setTimeout(() => {
                    hasil.innerHTML =
                        "✅ Jadi bre! Gaya <b>" +
                        gaya +
                        "</b> berhasil dibuat. (Demo - sambungin ke AI API buat beneran jadi)";
                }, 2000);
            }
        </script>
    </body>
</html>
